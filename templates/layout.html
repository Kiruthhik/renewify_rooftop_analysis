<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rooftop analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            background-color: #2e0546;
            color: white;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .header .navbar-nav {
            margin-left: auto;
        }

        .content {
            display: flex;
            flex: 1;
            margin-top: 60px; /* Add some top margin to avoid overlap with header */
            overflow-y: scroll;
        }

        .left-half {
      width: 50%;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Right half with 3D model */
    .right-half {
      width: 50%;
      background-color: #ffffff;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    body {
    font-family: 'Arial', sans-serif;
    background-color: #f5f5f5;
    margin: 0;
    padding: 10;
}


    </style>
</head>
<body>

    <div class="header">
        <div class="logo">
            <h2>Aerial Inspect</h2>
        </div>
        <nav class="navbar navbar-expand">
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link text-light" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="#">About us</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="#">Services</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="#">News</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="#">Contact</a></li>
                <li class="nav-item"><a class="nav-link text-light" href="#">Login / Register</a></li>
            </ul>
        </nav>
    </div>
    {% block main %}{% endblock %}
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
    
</html>
